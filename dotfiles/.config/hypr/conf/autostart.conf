#
# Apps are launched via ~/.config/hypr/scripts/app.sh, which wraps them in
# `uwsm app --` when the session was started by uwsm and execs them directly
# otherwise. This lets the same config work in both modes.

$app = ~/.config/hypr/scripts/app.sh

# Start Listeners
exec-once = $app ~/.config/ml4w/listeners.sh --startall

# Start Polkit
exec-once = $app /usr/bin/lxpolkit

# Start NetworkManager applet (tray icon for nm-connection-editor)
exec-once = $app nm-applet --indicator

# Restore Wallpaper
exec-once = $app ~/.config/ml4w/scripts/ml4w-wallpaper-app --restore

# Autostart script
exec-once = $app ~/.config/ml4w/scripts/ml4w-autostart

# Load GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# Start Waybar with ML4W theme
exec-once = $app ~/.config/waybar/launch.sh

# Load Notification Daemon
exec-once = $app swaync

# Using hypridle to start hyprlock
exec-once = $app hypridle

# Load cliphist history
exec-once = $app sh -c 'wl-paste --watch cliphist store'

# Start autostart cleanup
exec-once = ~/.config/hypr/scripts/cleanup.sh

# Load configuration from ML4W Hyprland Settings App
exec = ~/.config/com.ml4w.hyprlandsettings/hyprctl.sh
